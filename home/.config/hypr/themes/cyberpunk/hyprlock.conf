# Cyberpunk: neon magenta clock with a cyan ghost, hard-edged input.
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = neon, 0.68, -0.4, 0.27, 1.4
    animation = fadeIn, 1, 3, neon
    animation = fadeOut, 1, 3, neon
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 2
    blur_size = 6
    brightness = 0.45
    contrast = 1.2
    vibrancy = 0.4
}

label {
    monitor =
    text = // SYSTEM LOCKED //
    font_family = $font
    font_size = 16
    color = $accent2
    position = 0, 250
    halign = center
    valign = center
}

# Ghost copy, offset like a chromatic split.
label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 128
    color = $accent2_soft
    position = 6, 122
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 128
    color = $accent
    shadow_passes = 3
    shadow_size = 10
    shadow_color = $accent_soft
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %d.%m.%Y" | tr '[:lower:]' '[:upper:]'
    font_family = $font
    font_size = 18
    color = $fg
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 50
    outline_thickness = 3
    rounding = 0
    outer_color = $accent $accent2 45deg
    inner_color = $bg_glass
    font_color = $accent2
    font_family = $font
    placeholder_text = ◢ ACCESS KEY ◣
    fail_text = ✖ REJECTED [$ATTEMPTS]
    check_color = $accent2
    fail_color = $crit
    capslock_color = $warn
    dots_size = 0.25
    dots_spacing = 0.35
    dots_rounding = 0
    dots_center = true
    fade_on_empty = false
    position = 0, -90
    halign = center
    valign = center
}
