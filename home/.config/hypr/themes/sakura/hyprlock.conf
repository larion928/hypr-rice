# Sakura: blurred spring wallpaper, an italic serif clock, ✿ and a haiku by Issa.
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = petal, 0.34, 1.36, 0.64, 1
    bezier = fall, 0.45, 0, 0.55, 1
    animation = fadeIn, 1, 8, fall
    animation = fadeOut, 1, 6, fall
    animation = inputFieldDots, 1, 3, petal
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
    vibrancy = 0.25
}

label {
    monitor =
    text = ✿
    font_family = $display_font
    font_size = 34
    color = $accent
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $accent_soft
    position = 0, 265
    halign = center
    valign = center
}

label {
    monitor =
    text = <i>$TIME</i>
    font_family = $display_font
    font_size = 136
    color = $fg
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000077)
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/ru-date
    font_family = $display_font
    font_size = 26
    color = $accent2
    position = 0, -5
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 330, 54
    outline_thickness = 2
    rounding = -1
    outer_color = $accent $accent3 45deg
    inner_color = $bg_glass
    font_color = $fg
    font_family = $display_font
    placeholder_text = <i>✿  пароль  ✿</i>
    fail_text = <i>лепесток упал… ($ATTEMPTS)</i>
    check_color = $accent2
    fail_color = $accent3
    capslock_color = $warn
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, -110
    halign = center
    valign = center
}

label {
    monitor =
    text = <i>«Под вишнями в цвету нет совсем чужих людей»  — Исса</i>
    font_family = $display_font
    font_size = 17
    color = $muted
    position = 0, -185
    halign = center
    valign = center
}
