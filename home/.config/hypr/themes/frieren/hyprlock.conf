# Frieren: soft blurred wallpaper, light serif clock, a quiet quote and a rounded glassy input.
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = drift, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 10, drift
    animation = fadeOut, 1, 8, drift
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    vibrancy = 0.2
}

label {
    monitor =
    text = ✦
    font_family = $display_font
    font_size = 28
    color = $accent2
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_family = $display_font
    font_size = 120
    color = $fg
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $accent_soft
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/ru-date
    font_family = $display_font
    font_size = 22
    color = $accent2
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    rounding = 16
    outer_color = $accent2
    inner_color = $bg_glass
    font_color = $fg
    font_family = $display_font
    placeholder_text = <i>✦ пароль ✦</i>
    fail_text = <i>заклинание не сработало ($ATTEMPTS)</i>
    check_color = $accent
    fail_color = $crit
    capslock_color = $warn
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = <i>«Жизнь эльфа долгая — можно и подождать»</i>
    font_family = $display_font
    font_size = 14
    color = $muted
    position = 0, -170
    halign = center
    valign = center
}
