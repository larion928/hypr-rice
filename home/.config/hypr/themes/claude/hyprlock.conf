# Claude: blurred wallpaper, big serif clock, the spark, a soft terracotta pill for the password.
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = soft, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, soft
    animation = fadeOut, 1, 5, soft
    animation = inputFieldDots, 1, 3, soft
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.15
}

image {
    monitor =
    path = $theme_dir/assets/spark.png
    size = 72
    rounding = 0
    border_size = 0
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_family = $display_font
    font_size = 132
    color = $fg
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000066)
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/ru-date
    font_family = $display_font
    font_size = 24
    color = $accent2
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    rounding = -1
    outer_color = $accent
    inner_color = $bg2_glass
    font_color = $fg
    font_family = $display_font
    placeholder_text = <i>Пароль…</i>
    fail_text = <i>Не то. Попытка $ATTEMPTS</i>
    check_color = $accent2
    fail_color = $crit
    capslock_color = $warn
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = С возвращением, $USER
    font_family = $display_font
    font_size = 15
    color = $muted
    position = 0, -185
    halign = center
    valign = center
}
