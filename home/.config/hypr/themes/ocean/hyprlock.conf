# Ocean: deep blurred wallpaper, a rounded glowing clock, a pill-shaped input like a bubble.
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = rise, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 7, rise
    animation = fadeOut, 1, 6, rise
    animation = inputFieldDots, 1, 3, rise
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 9
    brightness = 0.55
    vibrancy = 0.3
}

label {
    monitor =
    text = ≋
    font_family = $display_font
    font_size = 34
    color = $accent
    shadow_passes = 3
    shadow_size = 8
    shadow_color = $accent_soft
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_family = $display_font
    font_size = 128
    color = $fg
    shadow_passes = 3
    shadow_size = 10
    shadow_color = $accent_soft
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/ru-date
    font_family = $display_font
    font_size = 22
    color = $accent
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    rounding = -1
    outer_color = $accent $accent2 90deg
    inner_color = $bg2_glass
    font_color = $fg
    font_family = $display_font
    placeholder_text = пароль…
    fail_text = буль-буль… мимо ($ATTEMPTS)
    check_color = $accent2
    fail_color = $crit
    capslock_color = $warn
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, -110
    halign = center
    valign = center
}

label {
    monitor =
    text = глубина 3000 м  ·  тишина
    font_family = $display_font
    font_size = 14
    color = $muted
    position = 0, -180
    halign = center
    valign = center
}
