# Hacker: dark wallpaper behind scanline-black, terminal prompt, square green input.
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = snap, 0.1, 0.9, 0.2, 1
    animation = fadeIn, 1, 2, snap
    animation = fadeOut, 1, 2, snap
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 1
    blur_size = 4
    brightness = 0.3
    noise = 0.04
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    font_family = $font
    font_size = 96
    color = $accent
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $accent_soft
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "[ $(date +%Y-%m-%d) ]  uptime $(uptime -p | sed 's/up //')"
    font_family = $font
    font_size = 14
    color = $accent3
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "root@$(uname -n):~$ ./unlock --user $USER"
    font_family = $font
    font_size = 15
    color = $accent
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 46
    outline_thickness = 1
    rounding = 0
    outer_color = $accent
    inner_color = rgba(000000dd)
    font_color = $accent
    font_family = $font
    placeholder_text = > enter passphrase_
    fail_text = ACCESS DENIED [$ATTEMPTS]
    check_color = $accent2
    fail_color = $crit
    capslock_color = $warn
    dots_size = 0.22
    dots_spacing = 0.4
    dots_rounding = 0
    dots_center = false
    fade_on_empty = false
    position = 0, -100
    halign = center
    valign = center
}
