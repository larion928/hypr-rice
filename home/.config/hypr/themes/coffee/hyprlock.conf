# Coffee: dark roast wallpaper, a mono clock, a caramel rectangle for the password.
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = calm, 0.3, 0, 0.2, 1
    animation = fadeIn, 1, 5, calm
    animation = fadeOut, 1, 4, calm
    animation = inputFieldDots, 1, 2, calm
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 2
    blur_size = 6
    brightness = 0.5
    contrast = 1.05
    vibrancy = 0.1
}

label {
    monitor =
    text = ☕  свежесварено
    font_family = $display_font
    font_size = 18
    color = $accent
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_family = $display_font
    font_size = 120
    color = $fg
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(00000088)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/ru-date
    font_family = $display_font
    font_size = 20
    color = $accent2
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 50
    outline_thickness = 3
    rounding = 6
    outer_color = $accent
    inner_color = $bg_glass
    font_color = $fg
    font_family = $display_font
    placeholder_text = пароль_
    fail_text = пережарено ($ATTEMPTS)
    check_color = $good
    fail_color = $crit
    capslock_color = $warn
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = сначала кофе. потом всё остальное.
    font_family = $display_font
    font_size = 13
    color = $muted
    position = 0, -170
    halign = center
    valign = center
}
