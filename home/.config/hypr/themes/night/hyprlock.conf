# Night: dark, minimal — a thin clock and a small underline-style input.
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = calm, 0.4, 0, 0.2, 1
    animation = fadeIn, 1, 5, calm
    animation = fadeOut, 1, 5, calm
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 9
    brightness = 0.4
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 88
    color = $fg
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%d.%m  %a"
    font_family = $font
    font_size = 14
    color = $muted
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 40
    outline_thickness = 1
    rounding = 8
    outer_color = $muted_soft
    inner_color = $bg_glass
    font_color = $fg
    font_family = $font
    placeholder_text = password
    fail_text = $ATTEMPTS
    check_color = $accent2
    fail_color = $crit
    capslock_color = $warn
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = true
    position = 0, -70
    halign = center
    valign = center
}
