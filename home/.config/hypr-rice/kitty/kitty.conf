# kitty for hypr-rice. Every option with its description: https://sw.kovidgoyal.net/kitty/conf/

font_family      JetBrains Mono
font_size 14.0
window_padding_width 10
background_opacity 0.75
shell /usr/bin/fish

# Used only until a theme is applied: theme.conf below sets every one of these.
foreground #c0caf5
background #1a1b26
selection_foreground #ffffff
selection_background #14b8a6
color0 #0b0c15
color1 #d2556c
color2 #7cd47b
color3 #efb184
color4 #6ca1f3
color5 #b78df0
color6 #69bcf4
color7 #c0caf5
color8  #39404a
color9  #f7768e
color10 #85e89d
color11 #f4cf8d
color12 #8fb9ff
color13 #d9a3ff
color14 #8fd3ff
color15 #f0f3f6

# Colours of the current desktop theme, generated by ~/.config/hypr/scripts/themegen.py.
# Kept after the colours above so they override them.
include theme.conf

# Your own settings (font, opacity, keys). Not part of the rice: rice update leaves it alone.
globinclude user.conf
