# Every push: the scripts parse, the commit is signed, and `rice install` goes through on a clean
# Arch system the way it does on a friend's machine (normal user, sudo, no terminal).
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git jq python openssh
      - uses: actions/checkout@v5
      - name: Shell scripts parse
        run: |
          status=0
          for f in install.sh rice sync.sh system/hypr-theme-root system/rice-cache-trim \
                   $(grep -rlI '^#!.*\(ba\)\?sh' home/.local/bin home/.config/hypr-rice/waybar/scripts); do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; status=1; }
          done
          exit $status
      - name: Python parses
        run: |
          python -m py_compile home/.config/hypr/scripts/*.py
          for f in $(grep -rlI '^#!.*python' home/.local/bin home/.config/hypr-rice/waybar/scripts); do
            python -m py_compile "$f"
          done
      - name: JSON is valid
        # Code - OSS files are JSONC (comments allowed) by design.
        run: |
          find home -name '*.json' -not -path '*/Code - OSS/*' -print0 | xargs -0 -n1 jq -e . >/dev/null
      - name: Commit is signed by the key in system/allowed_signers
        run: |
          git config --global --add safe.directory "$PWD"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=system/allowed_signers verify-commit HEAD

  install:
    needs: syntax
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - run: pacman -Syu --noconfirm --needed git sudo
      - uses: actions/checkout@v5
      - name: A normal user with sudo, like on a real install
        run: |
          useradd -m tester
          echo 'tester ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/tester
          cp -r "$GITHUB_WORKSPACE" /home/tester/hypr-rice
          chown -R tester: /home/tester/hypr-rice
      - name: rice install
        run: sudo -u tester -H env RICE_ASSUME=y RICE_APPS=none bash /home/tester/hypr-rice/rice install
      - name: The rice is in place
        run: |
          h=/home/tester
          for f in .config/hypr/hyprland.lua .config/hypr/.rice-installed .config/hypr/current-theme \
                   .config/hypr-rice/waybar/config.json .config/hypr-rice/allowed_signers .local/bin/rice; do
            test -e "$h/$f" || { echo "::error::missing ~/$f"; exit 1; }
          done
          # AUR packages come from hypr-rice-pkgs; rice only warns when one is missing.
          grep -v '^[[:space:]]*#' /home/tester/hypr-rice/packages/aur.txt | sed 's/[[:space:]]*#.*//' | grep . \
              | xargs pacman -Q
          mkdir -p /run/user/tester && chown tester: /run/user/tester
          sudo -u tester -H XDG_RUNTIME_DIR=/run/user/tester Hyprland --verify-config -c "$h/.config/hypr/hyprland.lua"
