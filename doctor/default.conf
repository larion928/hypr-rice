# rice doctor — настройки проверки системы (rice doctor).
# Формат INI: [раздел], потом «ключ = значение». Списки — через пробел или каждый элемент
# с новой строки с отступом. Строки с # — комментарии. Пустое значение — пустой список.
# Удали этот файл, и при следующем запуске появится свежий с настройками по умолчанию.

[services]
# Службы, которые на этой машине обязаны работать. Системные — как есть (cups.socket),
# пользовательские — с приставкой user: (user:syncthing.service).
watch =

[journal]
# Источники ошибок журнала (имя программы, как в отчёте), о которых не сообщать.
ignore_sources =
# Регулярные выражения (Python), по одному на строку: подходящие сообщения не считаются.
ignore_patterns =
# Сколько новых ошибок одного источника с прошлой проверки считать всплеском.
spike = 50

[thresholds]
# Заполненность раздела в процентах: предупреждение и проблема.
disk_warning = 85
disk_problem = 92
# Через сколько дней без полного обновления (pacman -Syu) напоминать.
upgrade_days = 14
# Температура процессора, °C, выше которой предупреждать.
cpu_temperature = 90
# Ёмкость батареи в процентах от заводской, ниже которой предупреждать.
battery_health = 70
# Службы, грузящиеся при загрузке дольше стольких секунд, попадают в отчёт.
boot_service_seconds = 10
# До какого размера ужимать журнал, когда диск полон (journalctl --vacuum-size).
journal_keep = 200M
